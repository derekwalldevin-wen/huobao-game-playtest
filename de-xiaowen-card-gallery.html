<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>德小文 · 新增卡图档案</title>
<style>
  :root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#101e20;color:#e7ddbd}
  body{max-width:1440px;margin:0 auto;padding:36px 24px 60px}
  header{border-bottom:1px solid #746346;margin-bottom:28px;padding-bottom:20px}
  h1{font-family:SimSun,serif;font-weight:500;margin:0;font-size:34px;letter-spacing:.08em}
  p{color:#a5b5ac;margin:8px 0}a{color:#c6dba6}
  main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}
  figure{margin:0;background:#172829;border:1px solid #655b41}
  img{display:block;width:100%;aspect-ratio:3/2;object-fit:contain}
  figcaption{padding:12px 16px}h2{margin:0;font:24px SimSun,serif}
  small{display:block;color:#a8b7a4;margin-top:8px;font-size:12px}
  #status{font-size:14px}
</style>
<header>
  <h1>德小文 · 新增卡图档案</h1>
  <p>16 张独立插画 · 保留原有 8 张 · 名称与数值仍由游戏实时渲染</p>
  <a href="/m3c-visual-smoke.html?stageDemo=1&demoHero=de-xiaowen&demoOpponent=guru&artProfile=web-hd">进入真实战斗试玩 →</a>
  <p id="status">正在载入运行时卡图…</p>
</header>
<main id="gallery" aria-label="新增卡图一览"></main>
<script type="module">
  const status = document.querySelector('#status');
  const gallery = document.querySelector('#gallery');
  try {
    const response = await fetch('/assets/card-completion-v1/de-xiaowen/manifest.json');
    if (!response.ok) throw new Error('资源目录尚未导出');
    const manifest = await response.json();
    let loaded = 0;
    for (const card of manifest.cards) {
      const figure = document.createElement('figure');
      const link = document.createElement('a');
      const img = document.createElement('img');
      const caption = document.createElement('figcaption');
      const title = document.createElement('h2');
      const id = document.createElement('small');
      link.href = '/' + card.runtime;
      img.alt = card.name + ' · 独立卡牌插画';
      img.onload = () => { loaded++; status.textContent = '已加载 ' + loaded + ' / ' + manifest.cards.length + ' 张运行时插画，点击图片查看大图。'; };
      img.onerror = () => { status.textContent = '加载失败：' + card.name; };
      img.src = link.href;
      title.textContent = card.name; id.textContent = card.cardId;
      link.append(img); caption.append(title,id); figure.append(link,caption); gallery.append(figure);
    }
  } catch (error) { status.textContent = error.message; }
</script>
</html>
